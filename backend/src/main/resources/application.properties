spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:placement_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
llm.api-key=${GEMINI_API_KEY:}
llm.model=${LLM_MODEL:gemini-2.5-flash}
selenium.url=${SELENIUM_URL:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# --- Actuator / health (used by Docker + Kubernetes probes) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.port=8080
