<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlaceBot | AI Placement Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7ff;--card:#fff;--ink:#17213a;--muted:#667085;--line:#e5e7eb;--primary:#5b4ff0;--primary2:#7549f5;--soft:#eef0ff;--danger:#c62828;--success:#16794a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.page{min-height:100vh;padding:clamp(12px,3vw,30px)}.register{width:100%;max-width:1180px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(12px,2vw,28px);align-items:stretch}.visual{position:relative;overflow:hidden;border-radius:26px;background:#eaf2ff;min-height:720px;box-shadow:0 20px 60px rgba(53,70,120,.12)}.visual img{width:100%;height:100%;min-height:720px;object-fit:cover;display:block}.visual .caption{position:absolute;left:28px;right:28px;bottom:25px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:18px;padding:20px}.caption h1{margin:0 0 7px;font-size:28px}.caption p{margin:0;color:var(--muted);line-height:1.6}.panel{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:clamp(16px,3vw,32px);box-shadow:0 20px 60px rgba(53,70,120,.10)}.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;display:grid;place-items:center;font-weight:800}.brand h2{margin:0;font-size:22px}.panel h3{font-size:27px;margin:10px 0 7px}.intro{color:var(--muted);margin:0 0 22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:600}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:white;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #5b4ff01a}.field textarea{min-height:82px;resize:vertical}.photo-box{display:flex;align-items:center;gap:14px}.preview{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:#f1f3f7}.file{font-size:13px}.help{font-size:12px;color:var(--muted)}.submit{width:100%;margin-top:20px;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;font-weight:700;box-shadow:0 8px 20px #5b4ff02e}.error{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}.success{color:var(--success);font-size:13px}.required{color:var(--danger)}
.chat-page{min-height:100vh;display:flex;flex-direction:column}.top{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.user-mini{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.mini-photo{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#eee;border:1px solid var(--line)}.chat-wrap{width:min(1050px,calc(100% - 24px));margin:18px auto;flex:1;display:flex;flex-direction:column;min-width:0}.welcome{text-align:center;margin:10px 0 22px}.welcome h1{font-size:32px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0}.chat-card{background:white;border:1px solid var(--line);border-radius:22px;box-shadow:0 15px 50px rgba(53,70,120,.08);display:flex;flex-direction:column;height:min(76vh,850px);min-height:420px;overflow:hidden}.messages{padding:clamp(12px,3vw,24px);overflow:auto;flex:1;min-height:0;background:linear-gradient(#fff,#fbfcff)}.bubble{max-width:78%;padding:12px 15px;border-radius:16px;margin-bottom:13px;line-height:1.55;white-space:pre-wrap}.bot{background:#f0f1ff;border-bottom-left-radius:5px}.me{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;margin-left:auto;border-bottom-right-radius:5px}.composer{padding:12px;border-top:1px solid var(--line);display:flex;gap:10px;background:white;position:relative}.composer input{min-width:0}.composer input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px}.send{border:0;border-radius:12px;background:var(--primary);color:white;padding:0 20px;font-weight:700}.quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 24px 18px;background:white}.chip{border:1px solid #dfe2ff;background:#f8f8ff;color:#4338ca;padding:8px 12px;border-radius:999px}.jobs{padding:0 24px 18px}.job{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}.job b{display:block}.job span{font-size:13px;color:var(--muted)}.job a{font-size:13px;color:var(--primary);text-decoration:none}.logout{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 11px;color:var(--muted)}.navtabs{display:flex;gap:6px;align-items:center;margin-left:auto;margin-right:16px}.navtab{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:10px;padding:9px 12px;font-weight:600}.navtab.active{background:var(--soft);color:var(--primary);border-color:#dedbff}.feature-wrap{width:min(1050px,calc(100% - 24px));margin:24px auto}.feature-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,30px);box-shadow:0 15px 50px rgba(53,70,120,.06)}.feature-card h1{margin-top:0}.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{border:1px solid var(--line);border-radius:14px;padding:16px}.stat strong{display:block;font-size:25px;color:var(--primary);margin-bottom:6px}.subject-row{display:grid;grid-template-columns:150px 1fr 44px;gap:12px;align-items:center;margin:16px 0}.bar{height:9px;background:#eef0f7;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:99px}.feature-action{border:0;border-radius:10px;padding:11px 15px;background:var(--primary);color:#fff;font-weight:600}.interview-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.interview-option{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left}.interview-option:hover{border-color:var(--primary)}.muted{color:var(--muted);line-height:1.6}.tools{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:#fbfbff}.upload-btn{border:1px dashed #b9b5f7;background:#f7f6ff;color:#4c42c7;border-radius:10px;padding:10px 13px;font-weight:600}.file-name{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.training{display:none;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 24px 18px;background:white}.training .chip{min-height:52px;text-align:left}.doc-status{font-size:12px;color:var(--success);margin-left:auto}.doc-list{padding:0 24px 12px;font-size:12px;color:var(--muted)}.doc-list span{display:inline-block;background:#f4f4fa;border-radius:8px;padding:5px 8px;margin:3px 4px 0 0}.voice-btn,.attach-remove{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;color:var(--primary);font-weight:600}.voice-btn.listening{background:#fff0f0;border-color:#f5a3a3;color:#b42318}.account-menu{position:relative}.settings-panel{max-width:720px;margin:24px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}.settings-panel h1{margin-top:0}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.settings-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.secondary{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px}.composer .voice-btn{white-space:nowrap}.file-chip{display:inline-flex;align-items:center;gap:8px;background:#f3f1ff;border-radius:10px;padding:6px 9px;color:#4c42c7;margin:5px 0}.file-chip button{border:0;background:transparent;color:#7b61ff}@media(max-width:600px){.settings-grid{grid-template-columns:1fr}.subject-row{grid-template-columns:110px 1fr 40px;gap:8px}}
@media(max-width:850px){.page{padding:12px}.register{grid-template-columns:minmax(0,1fr)}.visual{min-height:220px;max-height:320px}.visual img{min-height:220px;max-height:320px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:18px}.bubble{max-width:90%}.top{padding:0 15px}.welcome h1{font-size:26px}.training{grid-template-columns:1fr}.tools{flex-wrap:wrap}.chat-card{height:calc(100dvh - 145px);min-height:400px}.chat-wrap{margin:10px auto}.welcome{margin:8px 0 12px}.welcome p{padding:0 8px}.top{min-height:64px;height:auto;padding:10px 12px;gap:8px;flex-wrap:wrap}.navtabs{order:3;width:100%;justify-content:center;margin:0}.user-mini{flex-wrap:wrap;justify-content:flex-end}.composer{padding:9px}.send{padding:0 14px}.messages{padding:12px}.doc-status{margin-left:0}}
</style>
</head>
<body><div id="root"></div>
<script>
const $=s=>document.querySelector(s);let student=null;try{student=JSON.parse(localStorage.getItem('placebotStudent')||'null')}catch(e){student=null}let pendingFileName='';let pendingDocumentId=null;let recognition=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){const opts={method};if(body instanceof FormData){opts.body=body}else if(body!==undefined){opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify(body)}const r=await fetch('/api'+path,opts);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong.');return j}
function registration(){
 document.title='PlaceBot | Registration';
 $('#root').innerHTML=`<div class="page"><div class="register">
 <section class="visual"><img src="/placement-hero.png" alt="Students preparing for placements"><div class="caption"><h1>Your placement journey starts here.</h1><p>Register once and chat with PlaceBot for simple guidance on jobs, resumes, interviews, coding and placement preparation.</p></div></section>
 <section class="panel"><div class="brand"><div class="logo">P</div><h2>PlaceBot</h2></div><h3>Student Registration</h3><p class="intro">Enter your details to create your placement profile.</p>
 <form id="reg"><div class="form-grid">
 ${field('name','Full Name','text','Student name',true)}
 ${field('age','Age','number','Your age',true)}
 ${field('email','Email Address','email','you@example.com',true)}
 ${field('password','Password','password','At least 6 characters',true)}
 ${field('college','College / University','text','Name of your institution',true)}
 ${field('branch','Degree / Branch','text','Example: B.Tech – CSE',true)}
 ${field('state','State','text','Your state',true)}
 ${field('cgpa','CGPA','number','Example: 8.2',true,'step="0.01" min="0" max="10"')}
 ${field('backlogs','Backlogs','number','Active backlogs',true,'min="0"')}
 <div class="field full"><label>Address <span class="required">*</span></label><textarea id="address" placeholder="Student address"></textarea></div>
 <div class="field full"><label>Skills <span class="required">*</span></label><textarea id="skills" placeholder="Example: Java, Python, SQL"></textarea><span class="help">Add your main technical skills separated by commas.</span></div>
 <div class="field full"><label>Profile Photo <span class="help">(Optional)</span></label><div class="photo-box"><img id="preview" class="preview" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2772%27 height=%2772%27 viewBox=%270 0 72 72%27%3E%3Crect width=%2772%27 height=%2772%27 rx=%2736%27 fill=%27%23eef0ff%27/%3E%3Ccircle cx=%2736%27 cy=%2727%27 r=%2713%27 fill=%27%23a5a9d8%27/%3E%3Cpath d=%27M12 68c2-15 11-23 24-23s22 8 24 23%27 fill=%27%23a5a9d8%27/%3E%3C/svg%3E" alt="Default profile avatar"><div><input id="photo" class="file" type="file" accept="image/*"><div class="help">Choose a small JPG/PNG photo.</div></div></div></div>
 </div><button class="submit" type="submit">Create Profile & Continue</button><div id="err" class="error"></div></form><p class="intro" style="margin:16px 0 0;text-align:center">Already registered? <button type="button" class="secondary" id="showLogin">Sign in</button></p></section></div></div>`;
 $('#showLogin').onclick=loginPage;
 $('#photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>$('#preview').src=reader.result;reader.readAsDataURL(f)};
 $('#reg').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';const photo=$('#photo').files[0];let photoUrl='';if(photo){if(photo.size>900000){$('#err').textContent='Please choose a photo smaller than 900 KB.';return}photoUrl=await fileData(photo)}
 const body={name:$('#name').value,age:$('#age').value,email:$('#email').value,password:$('#password').value,college:$('#college').value,branch:$('#branch').value,state:$('#state').value,address:$('#address').value,cgpa:$('#cgpa').value,backlogs:$('#backlogs').value,skills:$('#skills').value,photoUrl};
 try{student=await api('/register','POST',body);localStorage.setItem('placebotStudent',JSON.stringify(student));chatPage()}catch(err){$('#err').textContent=err.message}}
}
function loginPage(){
 document.title='PlaceBot | Sign in';
 $('#root').innerHTML=`<div class="page"><div class="register"><section class="visual"><img src="/placement-hero.png" alt="Students preparing for placements"><div class="caption"><h1>Welcome back.</h1><p>Sign in to continue your saved conversations, progress and mock interviews.</p></div></section><section class="panel"><div class="brand"><div class="logo">P</div><h2>PlaceBot</h2></div><h3>Sign in</h3><p class="intro">Use the email and password you registered with.</p><form id="login"><div class="form-grid">${field('loginEmail','Email Address','email','you@example.com',true)}${field('loginPassword','Password','password','Your password',true)}</div><button class="submit" type="submit">Sign in to PlaceBot</button><div id="loginErr" class="error"></div></form><p class="intro" style="margin:16px 0 0;text-align:center">New to PlaceBot? <button type="button" class="secondary" id="showRegister">Create account</button></p></section></div></div>`;
 $('#showRegister').onclick=registration;
 $('#login').onsubmit=async e=>{e.preventDefault();$('#loginErr').textContent='';try{student=await api('/login','POST',{email:$('#loginEmail').value,password:$('#loginPassword').value});localStorage.setItem('placebotStudent',JSON.stringify(student));chatPage()}catch(err){$('#loginErr').textContent=err.message}};
}
function field(id,label,type,placeholder,req,extra=''){return `<div class="field"><label for="${id}">${label} ${req?'<span class="required">*</span>':''}</label><input id="${id}" type="${type}" placeholder="${placeholder}" ${extra}></div>`}
function fileData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function jobHtml(j){return `<div class="job"><b>${esc(j.title)}</b><span>${esc(j.company)} · ${esc(j.location)}</span><br><a href="${esc(j.applyLink)}" target="_blank" rel="noopener">Demo application link</a></div>`}
function chatPage(){
 document.title='PlaceBot | Assistant';const photo=student.photoUrl||'';
 $('#root').innerHTML=`<div class="chat-page"><header class="top"><div class="brand"><div class="logo">P</div><h2 style="margin:0">PlaceBot</h2></div><nav class="navtabs"><button class="navtab active" data-view="chat">Chat</button><button class="navtab" data-view="progress">My Progress</button><button class="navtab" data-view="interview">Mock Interviews</button></nav><div class="user-mini">${photo?`<img class="mini-photo" src="${photo}" alt="Profile photo">`:''}<span>Hi, ${esc(student.name)}</span><button class="logout" id="settingsBtn">Settings</button><button class="logout" id="logoutBtn">Log out</button></div></header>
 <main id="viewHost"><div class="chat-wrap"><div class="welcome"><h1>How can I help?</h1><p>Ask anything. Continue a previous conversation or attach a file for help.</p></div><section class="chat-card"><div id="messages" class="messages"></div><div class="tools"><label class="upload-btn" for="doc">📎 Attach file</label><input id="doc" type="file" hidden accept=".pdf,.doc,.docx,.txt,.rtf,.ppt,.pptx,.jpg,.jpeg,.png,.webp,.gif"><span id="fileName" class="file-name">Documents and images · max 8 MB</span><span id="docStatus" class="doc-status"></span></div><div id="docs" class="doc-list"></div><div id="attachedFile" style="padding:0 14px"></div><div class="composer"><input id="q" placeholder="Ask anything..." autocomplete="off"><button class="voice-btn" id="mic" type="button" title="Speak your message">🎙️</button><button class="send" id="send">Send</button></div></section></div></main></div>`;
 $('#logoutBtn').onclick=()=>{localStorage.removeItem('placebotStudent');student=null;loginPage()};
 $('#settingsBtn').onclick=renderSettings;
 document.querySelectorAll('[data-view]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b===btn));if(btn.dataset.view==='chat')renderChat();else if(btn.dataset.view==='progress')renderProgress();else renderInterview()});
 const host=$('#viewHost');
 function renderChat(){host.innerHTML=`<div class="chat-wrap"><div class="welcome"><h1>How can I help?</h1><p>Ask anything. Continue a previous conversation or attach a file for help.</p></div><section class="chat-card"><div id="messages" class="messages"></div><div class="tools"><label class="upload-btn" for="doc">📎 Attach file</label><input id="doc" type="file" hidden accept=".pdf,.doc,.docx,.txt,.rtf,.ppt,.pptx,.jpg,.jpeg,.png,.webp,.gif"><span id="fileName" class="file-name">Documents and images · max 8 MB</span><span id="docStatus" class="doc-status"></span></div><div id="docs" class="doc-list"></div><div id="attachedFile" style="padding:0 14px"></div><div class="composer"><input id="q" placeholder="Ask anything..." autocomplete="off"><button class="voice-btn" id="mic" type="button" title="Speak your message">🎙️</button><button class="send" id="send">Send</button></div></section></div>`;bindChat();}
 function renderSettings(){host.innerHTML=`<section class="settings-panel"><h1>Settings & Profile</h1><p class="muted">Your account details are saved with your PlaceBot profile.</p><form id="settingsForm"><div class="settings-grid">${field('setName','Full name','text','Your full name',true)}${field('setEmail','Email address','email','',true)}${field('setAge','Age','number','Age',false)}${field('setCollege','College / University','text','College',false)}${field('setBranch','Degree / Branch','text','B.Tech CSE',false)}${field('setState','State','text','State',false)}${field('setCgpa','CGPA','number','8.2',false,'step="0.01" min="0" max="10"')}${field('setBacklogs','Backlogs','number','0',false,'min="0"')}<div class="field" style="grid-column:1/-1"><label>Address</label><textarea id="setAddress"></textarea></div><div class="field" style="grid-column:1/-1"><label>Skills</label><textarea id="setSkills"></textarea></div></div><div class="settings-actions"><button class="feature-action" type="submit">Save changes</button><button class="secondary" type="button" id="cancelSettings">Back to chat</button><button class="secondary" type="button" id="logoutFromSettings">Log out</button></div><div id="settingsMsg" class="error"></div></form></section>`;const set=(id,v)=>$('#'+id).value=v??'';set('setName',student.name);set('setEmail',student.email);$('#setEmail').disabled=true;set('setAge',student.age);set('setCollege',student.college);set('setBranch',student.branch);set('setState',student.state);set('setCgpa',student.cgpa);set('setBacklogs',student.backlogs);set('setAddress',student.address);set('setSkills',student.skills);$('#cancelSettings').onclick=()=>switchView('chat');$('#logoutFromSettings').onclick=()=>{localStorage.removeItem('placebotStudent');student=null;loginPage()};$('#settingsForm').onsubmit=async e=>{e.preventDefault();$('#settingsMsg').textContent='Saving…';try{student=await api('/student/'+student.id,'PUT',{name:$('#setName').value,age:$('#setAge').value,college:$('#setCollege').value,branch:$('#setBranch').value,state:$('#setState').value,address:$('#setAddress').value,cgpa:$('#setCgpa').value,backlogs:$('#setBacklogs').value,skills:$('#setSkills').value});localStorage.setItem('placebotStudent',JSON.stringify(student));$('#settingsMsg').textContent='Profile updated successfully.';chatPage()}catch(err){$('#settingsMsg').textContent=err.message}}}
 async function renderProgress(){host.innerHTML='<div class="feature-wrap"><section class="feature-card"><h1>My Progress</h1><p class="muted">Your practice activity is estimated from saved conversations. Practise each subject in Chat or Mock Interviews to build your skills.</p><div id="progressContent">Loading your activity…</div></section></div>';try{const h=await api('/chat/'+student.id);const all=h.filter(x=>x.sender==='USER').map(x=>x.message.toLowerCase()).join(' ');const topics=[['DSA',['dsa','algorithm','array','linked list','tree','graph','sorting','searching']],['Java Programming',['java','oop','class','inheritance','exception','collection']],['Operating Systems',['operating system','os','process','thread','deadlock','scheduling','memory']],['DBMS & SQL',['dbms','sql','database','normalization','join']],['Computer Networks',['network','tcp','ip address','osi','http','dns']],['Aptitude & Reasoning',['aptitude','reasoning','percentage','probability','logical','ratio']],['Web & Software Engineering',['html','css','javascript','spring','software engineering','testing']]];const br=(student.branch||'').toLowerCase();if(/ece|electronics|communication|eee|electrical/.test(br))topics.push(['Electronics & Circuits',['circuit','digital logic','analog','microprocessor','signal','communication systems']]);if(/eee|electrical/.test(br))topics.push(['Electrical Engineering',['power systems','electrical machines','control systems','electromagnetics']]);if(/mechanical|mech/.test(br))topics.push(['Mechanical Engineering',['thermodynamics','manufacturing','fluid mechanics','machine design']]);if(/civil/.test(br))topics.push(['Civil Engineering',['structural','surveying','concrete','geotechnical','transportation']]);if(/data science|ai|artificial intelligence/.test(br))topics.push(['AI & Data Science',['machine learning','statistics','data science','neural network','pandas']]);const rows=topics.map(([n,words])=>{const hits=words.reduce((a,w)=>a+(all.split(w).length-1),0);const score=Math.min(100,hits*12);return `<div class="subject-row"><b>${n}</b><div class="bar"><span style="width:${score}%"></span></div><span>${score}%</span></div>`}).join('');const count=h.filter(x=>x.sender==='USER').length;$('#progressContent').innerHTML=`<div class="stat-grid"><div class="stat"><strong>${count}</strong><span>Questions asked</span></div><div class="stat"><strong>${h.filter(x=>x.sender==='BOT').length}</strong><span>AI responses</span></div><div class="stat"><strong>${topics.filter(([n,w])=>w.some(k=>all.includes(k))).length}</strong><span>Subjects explored</span></div></div><h3>Subject activity</h3>${rows}<p class="muted">These percentages represent conversation activity, not an exam score or verified mastery. Take mock questions and ask PlaceBot to assess your answers for a better skills review.</p><button class="feature-action" id="progressPractice">Practise a weak subject</button>`;$('#progressPractice').onclick=()=>{const weak=topics.map(([n,w])=>({n,score:w.reduce((a,k)=>a+(all.split(k).length-1),0)})).sort((a,b)=>a.score-b.score)[0];switchView('chat');setTimeout(()=>{const q=$('#q');if(q){q.value=`Give me a beginner-to-intermediate practice set for ${weak.n}. Ask one question at a time, wait for my answer, then grade it and explain the solution.`;q.focus()}},30)}}catch(e){$('#progressContent').textContent='Could not load progress: '+e.message}}
 function renderInterview(){
 host.innerHTML=`<div class="feature-wrap"><section class="feature-card"><h1>Mock Interviews</h1><p class="muted">Choose a practice type. PlaceBot asks one question at a time, waits for your answer, explains mistakes and continues. Your chat history is saved.</p><div class="interview-options"><button class="interview-option" data-kind="Aptitude & Reasoning"><b>Aptitude & Reasoning</b><p class="muted">Percentages, ratios, probability, puzzles, logic and data interpretation.</p></button><button class="interview-option" data-kind="Coding & DSA"><b>Coding & DSA</b><p class="muted">Write code, explain your approach, test edge cases and discuss complexity.</p></button><button class="interview-option" data-kind="Core CS Theory"><b>Core CS Theory</b><p class="muted">OS, DBMS, networks, OOP, software engineering and branch subjects.</p></button><button class="interview-option" data-kind="Full Placement Interview"><b>Full Placement Interview</b><p class="muted">Mixed aptitude, coding, technical, project and HR questions.</p></button></div><label for="difficulty"><b>Difficulty</b></label><select id="difficulty" style="margin:8px 0 18px;padding:10px;border:1px solid var(--line);border-radius:10px"><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option></select></section></div>`;
 document.querySelectorAll('[data-kind]').forEach(b=>{b.onclick=()=>{const kind=b.dataset.kind;const d=$('#difficulty').value;switchView('chat');setTimeout(()=>{const q=$('#q');if(q){q.value=`Start a ${d.toLowerCase()} ${kind} mock interview for a ${student.branch||'college'} student. Ask exactly ONE question at a time and wait for my answer. Do not require a fixed 60–90 second spoken answer; let me type or use the microphone. For coding, ask me to write code. After I answer, grade it with constructive feedback, show an ideal answer or correct code, then ask the next question. Keep track of score and topics covered in this conversation. Begin with question 1.`;q.focus();$('#send').click();}},30);};});
 }
 function switchView(name){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));if(name==='chat')renderChat();else if(name==='progress')renderProgress();else renderInterview()}

 function bindChat(){
 const add=(type,text)=>{const box=$('#messages');if(!box)return;box.insertAdjacentHTML('beforeend',`<div class="bubble ${type==='bot'?'bot':'me'}">${esc(text)}</div>`);box.scrollTop=box.scrollHeight};
 const send=async text=>{text=text.trim();if(!text && !pendingFileName)return;const prompt=(pendingFileName?'The user attached the file named "'+pendingFileName+'". Use its extracted contents or image in your answer, and answer the user question below. If the file contents are unavailable, say so clearly rather than guessing.\n\n':'')+(text||'Please summarize and explain the attached file.');add('me',(pendingFileName?'📎 '+pendingFileName+'\n':'')+(text||'Please summarize and explain the attached file.'));$('#q').value='';$('#send').disabled=true;$('#send').textContent='…';try{const r=await api('/chat','POST',{userId:student.id,message:prompt,documentId:pendingDocumentId});add('bot',r.reply);pendingFileName='';pendingDocumentId=null;if($('#attachedFile'))$('#attachedFile').innerHTML='';if($('#fileName'))$('#fileName').textContent='Documents and images · max 8 MB';if($('#docStatus'))$('#docStatus').textContent=''}catch(e){add('bot','⚠️ '+e.message)}finally{$('#send').disabled=false;$('#send').textContent='Send';$('#q').focus()}};
 $('#send').onclick=()=>send($('#q').value);$('#q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send($('#q').value)}};
 $('#mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add('bot','Speech-to-text is not available in this browser. Open PlaceBot in the latest Google Chrome or Microsoft Edge, then allow microphone access.');return}if(recognition){recognition.stop();return}const activeRecognition=new SR();recognition=activeRecognition;activeRecognition.lang='en-IN';activeRecognition.interimResults=true;activeRecognition.continuous=false;activeRecognition.maxAlternatives=1;$('#mic').classList.add('listening');$('#mic').textContent='Listening…';$('#mic').title='Click to stop listening';activeRecognition.onstart=()=>{if($('#mic'))$('#mic').textContent='⏹ Stop listening'};activeRecognition.onresult=e=>{let value='';for(let i=0;i<e.results.length;i++)value+=e.results[i][0].transcript;const q=$('#q');if(q){q.value=value.trim();q.focus()}};activeRecognition.onerror=e=>{let message='Microphone error: '+e.error+'. ';if(e.error==='not-allowed'||e.error==='service-not-allowed')message+='Allow microphone access in Chrome site settings.';else if(e.error==='no-speech')message+='No speech was detected; try again and speak after the button says Listening.';else if(e.error==='network')message+='The browser speech service could not connect. Check your internet connection.';add('bot',message)};activeRecognition.onend=()=>{if(recognition===activeRecognition)recognition=null;if($('#mic')){$('#mic').classList.remove('listening');$('#mic').textContent='🎙️';$('#mic').title='Speak your message'}if($('#q'))$('#q').focus()};try{activeRecognition.start()}catch(err){recognition=null;$('#mic').classList.remove('listening');$('#mic').textContent='🎙️';add('bot','Could not start speech recognition. Please reload the page and check microphone permission.')}};
 $('#doc').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#fileName').textContent=f.name;$('#docStatus').textContent='Uploading…';const form=new FormData();form.append('userId',student.id);form.append('file',f);try{const r=await api('/documents','POST',form);$('#docStatus').textContent='Ready to send ✓';pendingFileName=f.name;pendingDocumentId=r.id;$('#fileName').textContent='Ready to send with your next message';const chip=$('#attachedFile');if(chip)chip.innerHTML=`<span class="file-chip">📎 ${esc(f.name)} <button type="button" id="removeFile" aria-label="Remove attachment">×</button></span>`;const remove=$('#removeFile');if(remove)remove.onclick=()=>{pendingFileName='';pendingDocumentId=null;if($('#attachedFile'))$('#attachedFile').innerHTML='';$('#fileName').textContent='Documents and images · max 8 MB';$('#docStatus').textContent='';$('#doc').value=''};loadDocs()}catch(err){$('#docStatus').textContent='';add('bot','⚠️ '+err.message)}finally{e.target.value=''}};
 async function loadDocs(){try{const list=await api('/documents/'+student.id);$('#docs').innerHTML=list.length?'Attached files: '+list.map(d=>`<span>📎 ${esc(d.fileName)}</span>`).join(''):''}catch(e){}}
 async function loadHistory(){try{const history=await api('/chat/'+student.id);if(history.length){history.forEach(m=>add(m.sender==='USER'?'me':'bot',m.message))}else{add('bot',`Hi ${student.name}! 👋\nI'm PlaceBot. Ask me anything and I’ll do my best to help.`)}}catch(e){add('bot',`Hi ${student.name}! 👋\nI'm PlaceBot. Ask me anything and I’ll do my best to help.`)}}
 loadDocs();loadHistory();}
 bindChat();
}
(async()=>{if(student&&student.id){try{student=await api('/student/'+student.id);localStorage.setItem('placebotStudent',JSON.stringify(student));chatPage()}catch(e){localStorage.removeItem('placebotStudent');student=null;loginPage()}}else loginPage()})();
</script></body></html>
