services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: placement_db
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  selenium:
    image: selenium/standalone-chrome:latest
    restart: unless-stopped
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4444/status | grep -q '\"ready\": *true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      SELENIUM_URL: http://selenium:4444/wd/hub
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash}
    ports: ["8081:8080"]
    depends_on:
      db: { condition: service_healthy }
      selenium: { condition: service_started }

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  dbdata:
